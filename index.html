<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>바이브 코딩 프로젝트 포트폴리오</title>
  <!-- 한글 최적화 웹폰트 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-body: #edf2f7;
      --clay-card: #f8fafc;
      --primary-color: #4338ca;
      --primary-clay: #6366f1;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --current-font: 'Pretendard', sans-serif;

      --clay-shadow-card: 10px 10px 22px #cbd5e1, -10px -10px 22px #ffffff;
      --clay-shadow-btn: 5px 5px 10px #cbd5e1, -5px -5px 10px #ffffff;
      --clay-shadow-pressed: inset 3px 3px 6px #cbd5e1, inset -3px -3px 6px #ffffff;
      --clay-shadow-input: inset 3px 3px 6px #dce3ec, inset -3px -3px 6px #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--current-font);
      transition: font-family 0.2s ease, transform 0.15s ease;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.6;
      padding: 30px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 1060px;
      margin: 0 auto;
      flex: 1;
      width: 100%;
    }

    header {
      background: var(--clay-card);
      padding: 24px 32px;
      border-radius: 24px;
      box-shadow: var(--clay-shadow-card);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 32px;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .header-title h1 {
      font-size: 1.65rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.5px;
    }

    .header-title p {
      font-size: 0.92rem;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    select, input[type="text"], input[type="url"], textarea {
      padding: 10px 16px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      outline: none;
      background: #f1f5f9;
      color: var(--text-main);
      box-shadow: var(--clay-shadow-input);
      font-size: 0.9rem;
    }

    select:focus, input:focus, textarea:focus {
      border-color: var(--primary-clay);
    }

    .btn {
      padding: 10px 18px;
      border-radius: 16px;
      border: none;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: var(--clay-shadow-btn);
      text-decoration: none;
    }

    .btn:active {
      box-shadow: var(--clay-shadow-pressed);
      transform: translateY(2px);
    }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #4338ca);
      color: #ffffff;
      box-shadow: 5px 5px 12px #c7d2fe, -4px -4px 10px #ffffff;
    }

    .btn-secondary {
      background: #f1f5f9;
      color: var(--text-main);
    }

    .btn-success {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      box-shadow: 5px 5px 12px #a7f3d0, -4px -4px 10px #ffffff;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 0.8rem;
      border-radius: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--clay-card);
      border-radius: 24px;
      padding: 24px;
      box-shadow: var(--clay-shadow-card);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .badge-wrap {
      display: flex;
      gap: 6px;
    }

    .badge {
      background: #e0e7ff;
      color: var(--primary-color);
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 700;
      box-shadow: inset 2px 2px 4px #c7d2fe, inset -2px -2px 4px #ffffff;
    }

    .badge-file {
      background: #dcfce7;
      color: #15803d;
      box-shadow: inset 2px 2px 4px #bbf7d0, inset -2px -2px 4px #ffffff;
    }

    .badge-link {
      background: #e0f2fe;
      color: #0369a1;
      box-shadow: inset 2px 2px 4px #bae6fd, inset -2px -2px 4px #ffffff;
    }

    .card-title {
      font-size: 1.18rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-bottom: 16px;
      white-space: pre-line;
      flex-grow: 1;
    }

    .card-file-info {
      font-size: 0.8rem;
      color: #475569;
      background: #f1f5f9;
      padding: 8px 12px;
      border-radius: 12px;
      margin-bottom: 14px;
      word-break: break-all;
    }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #e2e8f0;
      padding-top: 12px;
    }

    .card-date {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 500;
    }

    .card-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    /* 모달 */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal {
      background: var(--clay-card);
      padding: 28px;
      border-radius: 26px;
      width: 92%;
      max-width: 520px;
      box-shadow: 20px 20px 40px rgba(0, 0, 0, 0.15), -10px -10px 30px #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.9);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h2 {
      font-size: 1.3rem;
      margin-bottom: 16px;
      color: #0f172a;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #475569;
    }

    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
    }

    .radio-group {
      display: flex;
      gap: 14px;
      margin-bottom: 10px;
    }

    .radio-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* 드래그 앤 드롭 파일 업로드 영역 */
    .file-upload-box {
      border: 2px dashed #94a3b8;
      border-radius: 16px;
      padding: 22px 16px;
      text-align: center;
      background: #f8fafc;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .file-upload-box.dragover {
      background: #eef2ff;
      border-color: var(--primary-clay);
    }

    .file-status {
      margin-top: 8px;
      font-size: 0.83rem;
      color: #059669;
      font-weight: 600;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
    }

    /* 인라인 러너 모달 */
    .runner-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(6px);
      z-index: 200;
      flex-direction: column;
      padding: 20px;
    }

    .runner-modal.active {
      display: flex;
    }

    .runner-container {
      background: #ffffff;
      border-radius: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .runner-header {
      background: #f8fafc;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
    }

    .runner-iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #ffffff;
    }

    footer {
      margin-top: 48px;
      text-align: center;
      padding: 20px;
      border-radius: 20px;
      background: var(--clay-card);
      box-shadow: var(--clay-shadow-card);
      color: #64748b;
      font-size: 0.85rem;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-title">
        <h1>교육 및 실천 포트폴리오</h1>
        <p>HTML 앱 직접 첨부 및 라이브 시연 아카이브</p>
      </div>

      <div class="controls">
        <label for="fontSelect" style="font-size: 0.85rem; font-weight: 700;">글꼴</label>
        <select id="fontSelect" onchange="changeFont(this.value)">
          <option value="'Pretendard', sans-serif">프리텐다드 (선명함)</option>
          <option value="'Noto Sans KR', sans-serif">본고딕 (단정함)</option>
          <option value="'Gowun Dodum', sans-serif">고운돋움 (따뜻함)</option>
        </select>
        <button class="btn btn-primary" onclick="openCreateModal()">+ 새 작품 등록</button>
      </div>
    </header>

    <div class="grid" id="portfolioGrid"></div>
  </div>

  <footer>
    <p>&copy; 2026 Jung Sung Hun. All Rights Reserved.</p>
  </footer>

  <!-- 등록 및 수정 모달 -->
  <div class="modal-backdrop" id="itemModal">
    <div class="modal">
      <h2 id="modalHeading">새 작품 등록</h2>
      <input type="hidden" id="editItemId" />

      <div class="form-group">
        <label for="itemCategory">분류</label>
        <select id="itemCategory">
          <option value="수업 혁신">수업 혁신</option>
          <option value="학급 경영">학급 경영</option>
          <option value="업무 자동화">업무 자동화</option>
          <option value="연구 및 기획">연구 및 기획</option>
        </select>
      </div>

      <div class="form-group">
        <label for="itemTitle">작품 제목</label>
        <input type="text" id="itemTitle" placeholder="예: 학급 운영 지원 도구 v4" />
      </div>

      <div class="form-group">
        <label>작품 제공 방식</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="uploadType" value="file" checked onchange="toggleUploadType()" />
            HTML 파일 직접 첨부
          </label>
          <label class="radio-label">
            <input type="radio" name="uploadType" value="link" onchange="toggleUploadType()" />
            웹 사이트 링크 연결
          </label>
        </div>
      </div>

      <!-- 개선된 파일 첨부 섹션 -->
      <div class="form-group" id="fileSection">
        <label>HTML 파일 선택 (.html, .htm)</label>
        <div class="file-upload-box" id="dropZone" onclick="triggerFileInput()">
          <p style="font-size: 0.9rem; color: #1e293b; font-weight: 600;">📁 클릭하거나 파일을 여기로 끌어다 놓으세요</p>
          <p style="font-size: 0.78rem; color: #64748b; margin-top: 4px;">단일 HTML 파일 내 자바스크립트/CSS 포함 앱 지원</p>
          <input type="file" id="htmlFileInput" accept=".html, .htm" style="display: none;" onchange="handleFileSelect(event)" />
        </div>
        <div class="file-status" id="fileStatusText"></div>
      </div>

      <div class="form-group" id="linkSection" style="display: none;">
        <label for="itemLink">라이브 실행 링크 (URL)</label>
        <input type="url" id="itemLink" placeholder="https://..." />
      </div>

      <div class="form-group">
        <label for="itemDesc">프로젝트 상세 설명</label>
        <textarea id="itemDesc" rows="4" placeholder="프로젝트의 개발 취지와 핵심 기능을 기록해 주세요."></textarea>
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">취소</button>
        <button class="btn btn-primary" onclick="handleSaveItem()">저장하기</button>
      </div>
    </div>
  </div>

  <!-- 라이브 실행 샌드박스 뷰어 -->
  <div class="runner-modal" id="runnerModal">
    <div class="runner-container">
      <div class="runner-header">
        <h3 id="runnerTitle" style="font-size: 1.05rem; color: #1e293b;">라이브 앱 실행</h3>
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-secondary btn-sm" id="runnerNewTabBtn">새 탭에서 열기</button>
          <button class="btn btn-secondary btn-sm" onclick="closeRunner()">닫기</button>
        </div>
      </div>
      <iframe class="runner-iframe" id="runnerIframe" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
    </div>
  </div>

  <script>
    // 1. IndexedDB 설정 (대용량 HTML 완벽 지원)
    const DB_NAME = 'EduPortfolioDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'portfolio_items';
    let db = null;

    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains(STORE_NAME)) {
            database.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        request.onsuccess = (e) => {
          db = e.target.result;
          resolve(db);
        };
        request.onerror = (e) => reject(e.target.error);
      });
    }

    function getAllItemsFromDB() {
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
      });
    }

    function saveItemToDB(item) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const req = store.put(item);
        req.onsuccess = () => resolve();
        req.onerror = (e) => reject(e.target.error);
      });
    }

    function deleteItemFromDB(id) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const req = store.delete(id);
        req.onsuccess = () => resolve();
        req.onerror = (e) => reject(e.target.error);
      });
    }

    // 2. 상태 변수
    let portfolioData = [];
    let uploadedHtmlContent = "";
    let uploadedFileName = "";
    let activeBlobUrl = null;

    // 3. 파일 입력 트리거 & 초기화 (재선택 오류 방지)
    function triggerFileInput() {
      const input = document.getElementById('htmlFileInput');
      input.value = ""; // 동일한 파일을 다시 선택해도 change 이벤트가 발생하도록 리셋
      input.click();
    }

    // 드래그 앤 드롭 리스너 초기화
    function initDropZone() {
      const dropZone = document.getElementById('dropZone');
      ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
          e.preventDefault();
          dropZone.classList.add('dragover');
        });
      });
      ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
          e.preventDefault();
          dropZone.classList.remove('dragover');
        });
      });
      dropZone.addEventListener('drop', (e) => {
        const files = e.dataTransfer.files;
        if (files.length > 0) {
          processFile(files[0]);
        }
      });
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) {
        processFile(file);
      }
    }

    function processFile(file) {
      if (!file.name.match(/\.(html|htm)$/i)) {
        alert("HTML 파일(.html, .htm)만 첨부할 수 있습니다.");
        return;
      }
      uploadedFileName = file.name;
      const reader = new FileReader();
      reader.onload = function(e) {
        uploadedHtmlContent = e.target.result;
        document.getElementById('fileStatusText').innerText = `✓ 첨부 완료: ${uploadedFileName} (${(file.size / 1024).toFixed(1)} KB)`;
      };
      reader.onerror = function() {
        alert("파일을 읽는 중 오류가 발생했습니다.");
      };
      reader.readAsText(file, "UTF-8");
    }

    function changeFont(fontFamily) {
      document.documentElement.style.setProperty('--current-font', fontFamily);
    }

    function toggleUploadType() {
      const type = document.querySelector('input[name="uploadType"]:checked').value;
      if (type === 'file') {
        document.getElementById('fileSection').style.display = 'block';
        document.getElementById('linkSection').style.display = 'none';
      } else {
        document.getElementById('fileSection').style.display = 'none';
        document.getElementById('linkSection').style.display = 'block';
      }
    }

    function renderGrid() {
      const grid = document.getElementById('portfolioGrid');
      grid.innerHTML = '';

      if (portfolioData.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #94a3b8; padding: 40px 0;">등록된 작품이 없습니다. 상단의 [+ 새 작품 등록] 버튼을 눌러보세요.</p>';
        return;
      }

      portfolioData.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';

        const isFile = item.type === 'file';
        const typeBadge = isFile
          ? `<span class="badge badge-file">HTML 파일 앱</span>`
          : `<span class="badge badge-link">웹 링크</span>`;

        const fileInfo = isFile && item.fileName
          ? `<div class="card-file-info">📄 첨부 파일: <strong>${escapeHtml(item.fileName)}</strong></div>`
          : '';

        let actionBtn = '';
        if (isFile) {
          actionBtn = `<button class="btn btn-success btn-sm" onclick="runApp(${item.id})">앱 실행하기</button>`;
        } else if (item.link && item.link !== '#') {
          actionBtn = `<a href="${escapeHtml(item.link)}" target="_blank" rel="noopener noreferrer" class="btn btn-primary btn-sm">웹 방문</a>`;
        }

        card.innerHTML = `
          <div>
            <div class="card-top">
              <div class="badge-wrap">
                <span class="badge">${item.category}</span>
                ${typeBadge}
              </div>
            </div>
            <h3 class="card-title">${escapeHtml(item.title)}</h3>
            ${fileInfo}
            <p class="card-desc">${escapeHtml(item.desc)}</p>
          </div>
          <div class="card-bottom">
            <span class="card-date">${item.date}</span>
            <div class="card-actions">
              ${actionBtn}
              <button class="btn btn-secondary btn-sm" onclick="openEditModal(${item.id})">수정</button>
              <button class="btn btn-secondary btn-sm" onclick="deleteItem(${item.id})">삭제</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openCreateModal() {
      document.getElementById('modalHeading').innerText = "새 작품 등록";
      document.getElementById('editItemId').value = "";
      document.getElementById('itemCategory').value = "수업 혁신";
      document.getElementById('itemTitle').value = "";
      document.getElementById('itemLink').value = "";
      document.getElementById('itemDesc').value = "";
      document.getElementById('htmlFileInput').value = "";
      document.getElementById('fileStatusText').innerText = "";
      document.querySelector('input[name="uploadType"][value="file"]').checked = true;
      uploadedHtmlContent = "";
      uploadedFileName = "";
      toggleUploadType();
      document.getElementById('itemModal').classList.add('active');
    }

    function openEditModal(id) {
      const target = portfolioData.find(d => d.id === id);
      if (!target) return;

      document.getElementById('modalHeading').innerText = "작품 정보 수정";
      document.getElementById('editItemId').value = target.id;
      document.getElementById('itemCategory').value = target.category;
      document.getElementById('itemTitle').value = target.title;
      document.getElementById('itemLink').value = target.link || "";
      document.getElementById('itemDesc').value = target.desc;
      document.getElementById('htmlFileInput').value = "";

      uploadedHtmlContent = target.htmlContent || "";
      uploadedFileName = target.fileName || "";

      if (target.type === 'file') {
        document.querySelector('input[name="uploadType"][value="file"]').checked = true;
        document.getElementById('fileStatusText').innerText = uploadedFileName ? `현재 첨부: ${uploadedFileName}` : "";
      } else {
        document.querySelector('input[name="uploadType"][value="link"]').checked = true;
        document.getElementById('fileStatusText').innerText = "";
      }

      toggleUploadType();
      document.getElementById('itemModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('itemModal').classList.remove('active');
    }

    async function handleSaveItem() {
      const editId = document.getElementById('editItemId').value;
      const category = document.getElementById('itemCategory').value;
      const title = document.getElementById('itemTitle').value.trim();
      const type = document.querySelector('input[name="uploadType"]:checked').value;
      const link = document.getElementById('itemLink').value.trim();
      const desc = document.getElementById('itemDesc').value.trim();

      if (!title || !desc) {
        alert("제목과 설명을 모두 입력해 주세요.");
        return;
      }

      if (type === 'file' && !uploadedHtmlContent) {
        alert("실행할 HTML 파일을 선택하여 첨부해 주세요.");
        return;
      }

      if (type === 'link' && !link) {
        alert("웹 사이트 링크 주소를 입력해 주세요.");
        return;
      }

      const item = {
        id: editId ? Number(editId) : Date.now(),
        category,
        title,
        type,
        link: type === 'link' ? link : '',
        fileName: type === 'file' ? uploadedFileName : '',
        htmlContent: type === 'file' ? uploadedHtmlContent : '',
        desc,
        date: editId ? (portfolioData.find(d => d.id === Number(editId))?.date || "2026.09") : getTodayString()
      };

      await saveItemToDB(item);
      portfolioData = await getAllItemsFromDB();
      portfolioData.sort((a, b) => b.id - a.id);

      renderGrid();
      closeModal();
    }

    async function deleteItem(id) {
      if (confirm("이 작품을 목록에서 영구히 삭제하시겠습니까?")) {
        await deleteItemFromDB(id);
        portfolioData = await getAllItemsFromDB();
        portfolioData.sort((a, b) => b.id - a.id);
        renderGrid();
      }
    }

    function runApp(id) {
      const target = portfolioData.find(d => d.id === id);
      if (!target || !target.htmlContent) {
        alert("첨부된 HTML 소스코드가 존재하지 않습니다.");
        return;
      }

      if (activeBlobUrl) {
        URL.revokeObjectURL(activeBlobUrl);
      }

      const blob = new Blob([target.htmlContent], { type: 'text/html;charset=utf-8' });
      activeBlobUrl = URL.createObjectURL(blob);

      document.getElementById('runnerTitle').innerText = `라이브 실행: ${target.title}`;
      const iframe = document.getElementById('runnerIframe');
      iframe.src = activeBlobUrl;

      document.getElementById('runnerNewTabBtn').onclick = function() {
        window.open(activeBlobUrl, '_blank');
      };

      document.getElementById('runnerModal').classList.add('active');
    }

    function closeRunner() {
      const iframe = document.getElementById('runnerIframe');
      iframe.src = 'about:blank';
      if (activeBlobUrl) {
        URL.revokeObjectURL(activeBlobUrl);
        activeBlobUrl = null;
      }
      document.getElementById('runnerModal').classList.remove('active');
    }

    function getTodayString() {
      const now = new Date();
      return `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}`;
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>'"]/g, tag => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[tag] || tag));
    }

    // 초기화 실행
    window.addEventListener('DOMContentLoaded', async () => {
      initDropZone();
      await openDB();
      portfolioData = await getAllItemsFromDB();

      // 최초 실행 시 기본 예시 등록
      if (portfolioData.length === 0) {
        const defaultItem = {
          id: 1,
          category: "수업 혁신",
          title: "과정중심 평가 기록 루브릭 샘플",
          type: "file",
          fileName: "rubric_sample.html",
          htmlContent: `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>루브릭</title><style>body{font-family:sans-serif;padding:40px;text-align:center;background:#f0fdf4;color:#166534;}h2{margin-bottom:12px;}.box{background:white;padding:24px;border-radius:16px;display:inline-block;box-shadow:0 10px 15px rgba(0,0,0,0.05);}</style></head><body><div class="box"><h2>과정중심 평가 루브릭 뷰어</h2><p>첨부된 단일 HTML 파일이 IndexedDB 런타임에서 안전하게 실행되었습니다.</p></div></body></html>`,
          desc: "학생들의 성취기준 도달 과정을 관찰하고 즉각 피드백을 기록하는 시스템 샘플입니다.",
          date: "2026.09"
        };
        await saveItemToDB(defaultItem);
        portfolioData = [defaultItem];
      }

      portfolioData.sort((a, b) => b.id - a.id);
      renderGrid();
    });
  </script>
</body>
</html>
