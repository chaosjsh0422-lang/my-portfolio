<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>소낙비의 바이브 코딩 포트폴리오</title>
  <!-- 한글 웹폰트 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-body: #e8ecf4;
      --clay-bg: #f3f6fc;
      --clay-card-border: rgba(255, 255, 255, 0.85);
      
      /* Claymorphism Shadows */
      --clay-shadow-card: 14px 14px 28px #c5cbd7, -12px -12px 28px #ffffff;
      --clay-shadow-btn: 6px 6px 14px #c2c9d6, -6px -6px 14px #ffffff;
      --clay-shadow-inset: inset 4px 4px 8px #d0d6e2, inset -4px -4px 8px #ffffff;
      --clay-shadow-badge: inset 2px 2px 5px rgba(0,0,0,0.06), inset -2px -2px 5px #ffffff;
      
      --text-main: #1e293b;
      --text-sub: #64748b;
      --primary-color: #4f46e5;
      /* 기본 글꼴을 '고운돋움'으로 설정 */
      --current-font: 'Gowun Dodum', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--current-font);
      transition: font-family 0.2s ease, transform 0.15s ease;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.6;
      padding: 36px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      flex: 1;
      width: 100%;
    }

    /* 클레이 헤더 */
    header {
      background: var(--clay-bg);
      padding: 26px 34px;
      border-radius: 28px;
      box-shadow: var(--clay-shadow-card);
      border: 2px solid var(--clay-card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 34px;
    }

    .header-title h1 {
      font-size: 1.7rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.5px;
    }

    .header-title p {
      font-size: 0.93rem;
      color: var(--text-sub);
      margin-top: 3px;
      font-weight: 500;
    }

    .controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    /* 클레이 폼 컨트롤 */
    select, input[type="text"], input[type="url"], textarea {
      padding: 11px 16px;
      border-radius: 18px;
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      outline: none;
      background: #eef2f8;
      color: var(--text-main);
      box-shadow: var(--clay-shadow-inset);
      font-size: 0.92rem;
    }

    select:focus, input:focus, textarea:focus {
      border-color: #818cf8;
      background: #f8fafc;
    }

    /* 클레이 버튼 */
    .btn {
      padding: 10px 20px;
      border-radius: 20px;
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: var(--clay-shadow-btn);
      text-decoration: none;
    }

    .btn:active {
      box-shadow: var(--clay-shadow-inset);
      transform: translateY(2px);
    }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 6px 6px 16px #b8c0d9, -6px -6px 16px #ffffff;
    }

    .btn-secondary {
      background: #e9eff7;
      color: var(--text-main);
    }

    .btn-success {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      box-shadow: 6px 6px 16px #b4dfcb, -6px -6px 16px #ffffff;
    }

    .btn-sm {
      padding: 7px 14px;
      font-size: 0.82rem;
      border-radius: 14px;
    }

    /* 카드 그리드 */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 26px;
    }

    /* 클레이 카드 */
    .card {
      background: var(--clay-bg);
      border-radius: 28px;
      padding: 26px;
      box-shadow: var(--clay-shadow-card);
      border: 2px solid var(--clay-card-border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge-wrap {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* 클레이 뱃지 */
    .badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.76rem;
      font-weight: 700;
      box-shadow: var(--clay-shadow-badge);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .badge-cat {
      background: #e0e7ff;
      color: #4338ca;
    }

    .badge-file {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .badge-link {
      background: #e0e7ff;
      color: #3730a3;
    }

    /* 개인/공용 구분 뱃지 */
    .badge-scope-public {
      background: #dcfce7;
      color: #15803d;
    }

    .badge-scope-private {
      background: #fef3c7;
      color: #b45309;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-bottom: 16px;
      white-space: pre-line;
      flex-grow: 1;
    }

    .card-file-info {
      font-size: 0.8rem;
      color: #475569;
      background: #e6ebf5;
      padding: 8px 12px;
      border-radius: 14px;
      margin-bottom: 14px;
      word-break: break-all;
      box-shadow: var(--clay-shadow-inset);
    }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1.5px solid #dbe2ee;
      padding-top: 14px;
    }

    .card-date {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 600;
    }

    .card-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    /* 클레이 모달 */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal {
      background: #f3f6fc;
      padding: 30px;
      border-radius: 30px;
      width: 92%;
      max-width: 530px;
      box-shadow: 20px 20px 40px rgba(0, 0, 0, 0.18), -12px -12px 30px #ffffff;
      border: 2px solid rgba(255, 255, 255, 0.9);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h2 {
      font-size: 1.35rem;
      margin-bottom: 18px;
      color: #0f172a;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.86rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #475569;
    }

    .form-group input[type="text"], 
    .form-group input[type="url"], 
    .form-group textarea, 
    .form-group select {
      width: 100%;
    }

    .radio-group {
      display: flex;
      gap: 16px;
      background: #eef2f8;
      padding: 8px 14px;
      border-radius: 16px;
      box-shadow: var(--clay-shadow-inset);
    }

    .radio-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      color: #334155;
    }

    .file-upload-box {
      border: 2px dashed #94a3b8;
      border-radius: 20px;
      padding: 22px 16px;
      text-align: center;
      background: #eef2f8;
      cursor: pointer;
      box-shadow: var(--clay-shadow-inset);
      transition: all 0.2s ease;
    }

    .file-upload-box.dragover {
      background: #e0e7ff;
      border-color: var(--primary-color);
    }

    .file-status {
      margin-top: 8px;
      font-size: 0.83rem;
      color: #059669;
      font-weight: 700;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
    }

    /* 실행창 */
    .runner-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(6px);
      z-index: 200;
      flex-direction: column;
      padding: 24px;
    }

    .runner-modal.active {
      display: flex;
    }

    .runner-container {
      background: #ffffff;
      border-radius: 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    .runner-header {
      background: #f8fafc;
      padding: 14px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1.5px solid #e2e8f0;
    }

    .runner-iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #ffffff;
    }

    /* 푸터 및 저작권 */
    footer {
      margin-top: 50px;
      text-align: center;
      padding: 22px;
      border-radius: 24px;
      background: var(--clay-bg);
      box-shadow: var(--clay-shadow-card);
      border: 2px solid var(--clay-card-border);
      color: #64748b;
      font-size: 0.88rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-title">
        <h1>소낙비의 바이브 코딩 포트폴리오</h1>
        <p>인터랙티브 웹 앱 & 교육 자동화 도구 아카이브</p>
      </div>

      <div class="controls">
        <!-- 정렬 선택 컨트롤 -->
        <label for="sortSelect" style="font-size: 0.86rem; font-weight: 700;">정렬</label>
        <select id="sortSelect" onchange="handleSortChange(this.value)">
          <option value="latest">최신 등록순</option>
          <option value="title">이름순 (가나다)</option>
          <option value="category">분류별</option>
        </select>

        <!-- 글꼴 선택 컨트롤 (고운돋움 기본 선택) -->
        <label for="fontSelect" style="font-size: 0.86rem; font-weight: 700;">글꼴</label>
        <select id="fontSelect" onchange="changeFont(this.value)">
          <option value="'Gowun Dodum', sans-serif" selected>고운돋움 (기본)</option>
          <option value="'Pretendard', sans-serif">프리텐다드 (깔끔함)</option>
          <option value="'Noto Sans KR', sans-serif">본고딕 (단정함)</option>
        </select>
        <button class="btn btn-primary" onclick="openCreateModal()">+ 새 작품 등록</button>
      </div>
    </header>

    <div class="grid" id="portfolioGrid"></div>
  </div>

  <footer>
    <p>&copy; 2026 Jeong SeongHun. All Rights Reserved.</p>
  </footer>

  <!-- 등록 및 수정 모달 -->
  <div class="modal-backdrop" id="itemModal">
    <div class="modal">
      <h2 id="modalHeading">새 작품 등록</h2>
      <input type="hidden" id="editItemId" />

      <!-- 구분 (개인 / 공용) -->
      <div class="form-group">
        <label>공개 범위</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="itemScope" value="공용" checked />
            🌐 공용 (Public)
          </label>
          <label class="radio-label">
            <input type="radio" name="itemScope" value="개인" />
            🔒 개인 (Private)
          </label>
        </div>
      </div>

      <!-- 분류 (수업 혁신, 학급 경영, 업무 자동화, 기타) -->
      <div class="form-group">
        <label for="itemCategory">분류</label>
        <select id="itemCategory">
          <option value="수업 혁신">수업 혁신</option>
          <option value="학급 경영">학급 경영</option>
          <option value="업무 자동화">업무 자동화</option>
          <option value="기타">기타</option>
        </select>
      </div>

      <div class="form-group">
        <label for="itemTitle">작품 제목</label>
        <input type="text" id="itemTitle" placeholder="예: 학급일지 v4 대시보드" />
      </div>

      <div class="form-group">
        <label>작품 제공 방식</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="uploadType" value="file" checked onchange="toggleUploadType()" />
            HTML 파일 직접 첨부
          </label>
          <label class="radio-label">
            <input type="radio" name="uploadType" value="link" onchange="toggleUploadType()" />
            웹 링크 연결
          </label>
        </div>
      </div>

      <!-- 파일 첨부 -->
      <div class="form-group" id="fileSection">
        <label>HTML 파일 선택 (.html, .htm)</label>
        <div class="file-upload-box" id="dropZone" onclick="triggerFileInput()">
          <p style="font-size: 0.92rem; color: #1e293b; font-weight: 700;">📁 클릭하거나 파일을 드래그하세요</p>
          <p style="font-size: 0.8rem; color: #64748b; margin-top: 4px;">단일 HTML 파일 내 자바스크립트/스타일 포함 앱 지원</p>
          <input type="file" id="htmlFileInput" accept=".html, .htm" style="display: none;" onchange="handleFileSelect(event)" />
        </div>
        <div class="file-status" id="fileStatusText"></div>
      </div>

      <div class="form-group" id="linkSection" style="display: none;">
        <label for="itemLink">웹 사이트 링크 (URL)</label>
        <input type="url" id="itemLink" placeholder="https://..." />
      </div>

      <div class="form-group">
        <label for="itemDesc">프로젝트 상세 설명</label>
        <textarea id="itemDesc" rows="4" placeholder="프로젝트의 목적과 주요 기능을 입력해 주세요."></textarea>
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">취소</button>
        <button class="btn btn-primary" onclick="handleSaveItem()">저장하기</button>
      </div>
    </div>
  </div>

  <!-- 라이브 실행 샌드박스 뷰어 -->
  <div class="runner-modal" id="runnerModal">
    <div class="runner-container">
      <div class="runner-header">
        <h3 id="runnerTitle" style="font-size: 1.05rem; color: #1e293b;">라이브 앱 실행</h3>
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-secondary btn-sm" id="runnerNewTabBtn">새 탭에서 열기</button>
          <button class="btn btn-secondary btn-sm" onclick="closeRunner()">닫기</button>
        </div>
      </div>
      <iframe class="runner-iframe" id="runnerIframe" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
    </div>
  </div>

  <script>
    // 1. IndexedDB 설정
    const DB_NAME = 'SonakbiPortfolioDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'portfolio_items';
    let db = null;

    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains(STORE_NAME)) {
            database.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        request.onsuccess = (e) => {
          db = e.target.result;
          resolve(db);
        };
        request.onerror = (e) => reject(e.target.error);
      });
    }

    function getAllItemsFromDB() {
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
      });
    }

    function saveItemToDB(item) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const req = store.put(item);
        req.onsuccess = () => resolve();
        req.onerror = (e) => reject(e.target.error);
      });
    }

    function deleteItemFromDB(id) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const req = store.delete(id);
        req.onsuccess = () => resolve();
        req.onerror = (e) => reject(e.target.error);
      });
    }

    // 2. 상태 관리 변수
    let portfolioData = [];
    let currentSortMode = 'latest';
    let uploadedHtmlContent = "";
    let uploadedFileName = "";
    let activeBlobUrl = null;

    function triggerFileInput() {
      const input = document.getElementById('htmlFileInput');
      input.value = "";
      input.click();
    }

    function initDropZone() {
      const dropZone = document.getElementById('dropZone');
      ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
          e.preventDefault();
          dropZone.classList.add('dragover');
        });
      });
      ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
          e.preventDefault();
          dropZone.classList.remove('dragover');
        });
      });
      dropZone.addEventListener('drop', (e) => {
        const files = e.dataTransfer.files;
        if (files.length > 0) {
          processFile(files[0]);
        }
      });
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) {
        processFile(file);
      }
    }

    function processFile(file) {
      if (!file.name.match(/\.(html|htm)$/i)) {
        alert("HTML 파일(.html, .htm)만 업로드할 수 있습니다.");
        return;
      }
      uploadedFileName = file.name;
      const reader = new FileReader();
      reader.onload = function(e) {
        uploadedHtmlContent = e.target.result;
        document.getElementById('fileStatusText').innerText = `✓ 첨부 완료: ${uploadedFileName} (${(file.size / 1024).toFixed(1)} KB)`;
      };
      reader.onerror = function() {
        alert("파일을 읽는 중 오류가 발생했습니다.");
      };
      reader.readAsText(file, "UTF-8");
    }

    function changeFont(fontFamily) {
      document.documentElement.style.setProperty('--current-font', fontFamily);
    }

    function toggleUploadType() {
      const type = document.querySelector('input[name="uploadType"]:checked').value;
      if (type === 'file') {
        document.getElementById('fileSection').style.display = 'block';
        document.getElementById('linkSection').style.display = 'none';
      } else {
        document.getElementById('fileSection').style.display = 'none';
        document.getElementById('linkSection').style.display = 'block';
      }
    }

    // 정렬 변경 이벤트 핸들러
    function handleSortChange(mode) {
      currentSortMode = mode;
      renderGrid();
    }

    // 정렬 로직
    function getSortedList() {
      const list = [...portfolioData];
      const categoryOrder = {
        '수업 혁신': 1,
        '학급 경영': 2,
        '업무 자동화': 3,
        '기타': 4
      };

      if (currentSortMode === 'title') {
        // 이름순 (한국어 로캘 기준 가나다/ABC 정렬)
        list.sort((a, b) => (a.title || '').localeCompare(b.title || '', 'ko'));
      } else if (currentSortMode === 'category') {
        // 분류순: 지정된 우선순위대로 정렬 후 이름순 보조 정렬
        list.sort((a, b) => {
          const orderA = categoryOrder[a.category] || 99;
          const orderB = categoryOrder[b.category] || 99;
          if (orderA !== orderB) return orderA - orderB;
          return (a.title || '').localeCompare(b.title || '', 'ko');
        });
      } else {
        // 최신 등록순 (기본)
        list.sort((a, b) => b.id - a.id);
      }
      return list;
    }

    function renderGrid() {
      const grid = document.getElementById('portfolioGrid');
      grid.innerHTML = '';

      const displayList = getSortedList();

      if (displayList.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #94a3b8; padding: 40px 0;">등록된 작품이 없습니다. 상단의 [+ 새 작품 등록] 버튼을 눌러보세요.</p>';
        return;
      }

      displayList.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';

        const isFile = item.type === 'file';
        const typeBadge = isFile
          ? `<span class="badge badge-file">HTML 파일</span>`
          : `<span class="badge badge-link">웹 링크</span>`;

        // 개인 / 공용 뱃지
        const scope = item.scope || '공용';
        const scopeBadge = scope === '공용'
          ? `<span class="badge badge-scope-public">🌐 공용</span>`
          : `<span class="badge badge-scope-private">🔒 개인</span>`;

        const fileInfo = isFile && item.fileName
          ? `<div class="card-file-info">📄 첨부: <strong>${escapeHtml(item.fileName)}</strong></div>`
          : '';

        let actionBtn = '';
        if (isFile) {
          actionBtn = `<button class="btn btn-success btn-sm" onclick="runApp(${item.id})">앱 실행</button>`;
        } else if (item.link && item.link !== '#') {
          actionBtn = `<a href="${escapeHtml(item.link)}" target="_blank" rel="noopener noreferrer" class="btn btn-primary btn-sm">웹 방문</a>`;
        }

        card.innerHTML = `
          <div>
            <div class="card-top">
              <div class="badge-wrap">
                ${scopeBadge}
                <span class="badge badge-cat">${escapeHtml(item.category)}</span>
                ${typeBadge}
              </div>
            </div>
            <h3 class="card-title">${escapeHtml(item.title)}</h3>
            ${fileInfo}
            <p class="card-desc">${escapeHtml(item.desc)}</p>
          </div>
          <div class="card-bottom">
            <span class="card-date">${item.date}</span>
            <div class="card-actions">
              ${actionBtn}
              <button class="btn btn-secondary btn-sm" onclick="openEditModal(${item.id})">수정</button>
              <button class="btn btn-secondary btn-sm" onclick="deleteItem(${item.id})">삭제</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openCreateModal() {
      document.getElementById('modalHeading').innerText = "새 작품 등록";
      document.getElementById('editItemId').value = "";
      document.querySelector('input[name="itemScope"][value="공용"]').checked = true;
      document.getElementById('itemCategory').value = "수업 혁신";
      document.getElementById('itemTitle').value = "";
      document.getElementById('itemLink').value = "";
      document.getElementById('itemDesc').value = "";
      document.getElementById('htmlFileInput').value = "";
      document.getElementById('fileStatusText').innerText = "";
      document.querySelector('input[name="uploadType"][value="file"]').checked = true;
      uploadedHtmlContent = "";
      uploadedFileName = "";
      toggleUploadType();
      document.getElementById('itemModal').classList.add('active');
    }

    function openEditModal(id) {
      const target = portfolioData.find(d => d.id === id);
      if (!target) return;

      document.getElementById('modalHeading').innerText = "작품 정보 수정";
      document.getElementById('editItemId').value = target.id;
      
      const scopeVal = target.scope || '공용';
      const scopeRadio = document.querySelector(`input[name="itemScope"][value="${scopeVal}"]`);
      if (scopeRadio) scopeRadio.checked = true;

      document.getElementById('itemCategory').value = target.category;
      document.getElementById('itemTitle').value = target.title;
      document.getElementById('itemLink').value = target.link || "";
      document.getElementById('itemDesc').value = target.desc;
      document.getElementById('htmlFileInput').value = "";

      uploadedHtmlContent = target.htmlContent || "";
      uploadedFileName = target.fileName || "";

      if (target.type === 'file') {
        document.querySelector('input[name="uploadType"][value="file"]').checked = true;
        document.getElementById('fileStatusText').innerText = uploadedFileName ? `현재 첨부: ${uploadedFileName}` : "";
      } else {
        document.querySelector('input[name="uploadType"][value="link"]').checked = true;
        document.getElementById('fileStatusText').innerText = "";
      }

      toggleUploadType();
      document.getElementById('itemModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('itemModal').classList.remove('active');
    }

    async function handleSaveItem() {
      const editId = document.getElementById('editItemId').value;
      const scope = document.querySelector('input[name="itemScope"]:checked').value;
      const category = document.getElementById('itemCategory').value;
      const title = document.getElementById('itemTitle').value.trim();
      const type = document.querySelector('input[name="uploadType"]:checked').value;
      const link = document.getElementById('itemLink').value.trim();
      const desc = document.getElementById('itemDesc').value.trim();

      if (!title || !desc) {
        alert("제목과 설명을 모두 입력해 주세요.");
        return;
      }

      if (type === 'file' && !uploadedHtmlContent) {
        alert("실행할 HTML 파일을 선택해 주세요.");
        return;
      }

      if (type === 'link' && !link) {
        alert("웹 링크 주소를 입력해 주세요.");
        return;
      }

      const item = {
        id: editId ? Number(editId) : Date.now(),
        scope,
        category,
        title,
        type,
        link: type === 'link' ? link : '',
        fileName: type === 'file' ? uploadedFileName : '',
        htmlContent: type === 'file' ? uploadedHtmlContent : '',
        desc,
        date: editId ? (portfolioData.find(d => d.id === Number(editId))?.date || "2026.09") : getTodayString()
      };

      await saveItemToDB(item);
      portfolioData = await getAllItemsFromDB();

      renderGrid();
      closeModal();
    }

    async function deleteItem(id) {
      if (confirm("이 작품을 삭제하시겠습니까?")) {
        await deleteItemFromDB(id);
        portfolioData = await getAllItemsFromDB();
        renderGrid();
      }
    }

    function runApp(id) {
      const target = portfolioData.find(d => d.id === id);
      if (!target || !target.htmlContent) {
        alert("첨부된 소스코드가 없습니다.");
        return;
      }

      if (activeBlobUrl) {
        URL.revokeObjectURL(activeBlobUrl);
      }

      const blob = new Blob([target.htmlContent], { type: 'text/html;charset=utf-8' });
      activeBlobUrl = URL.createObjectURL(blob);

      document.getElementById('runnerTitle').innerText = `라이브 실행: ${target.title}`;
      const iframe = document.getElementById('runnerIframe');
      iframe.src = activeBlobUrl;

      document.getElementById('runnerNewTabBtn').onclick = function() {
        window.open(activeBlobUrl, '_blank');
      };

      document.getElementById('runnerModal').classList.add('active');
    }

    function closeRunner() {
      const iframe = document.getElementById('runnerIframe');
      iframe.src = 'about:blank';
      if (activeBlobUrl) {
        URL.revokeObjectURL(activeBlobUrl);
        activeBlobUrl = null;
      }
      document.getElementById('runnerModal').classList.remove('active');
    }

    function getTodayString() {
      const now = new Date();
      return `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}`;
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>'"]/g, tag => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[tag] || tag));
    }

    window.addEventListener('DOMContentLoaded', async () => {
      initDropZone();
      await openDB();
      portfolioData = await getAllItemsFromDB();

      if (portfolioData.length === 0) {
        const defaultItem = {
          id: 1,
          scope: "공용",
          category: "수업 혁신",
          title: "과정중심 평가 기록 루브릭",
          type: "file",
          fileName: "rubric_sample.html",
          htmlContent: `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>루브릭</title><style>body{font-family:sans-serif;padding:40px;text-align:center;background:#eef2f8;color:#1e293b;}.box{background:#f8fafc;padding:26px;border-radius:22px;display:inline-block;box-shadow:8px 8px 16px #cbd5e1, -8px -8px 16px #ffffff;}</style></head><body><div class="box"><h2>클레이 스타일 과정중심 평가 루브릭</h2><p style="margin-top:10px; color:#64748b;">IndexedDB 런타임에서 안전하게 실행되는 단일 HTML 앱입니다.</p></div></body></html>`,
          desc: "학생들의 성취기준 도달 과정을 관찰하고 즉각 피드백을 기록하는 시스템 샘플입니다.",
          date: "2026.09"
        };
        await saveItemToDB(defaultItem);
        portfolioData = [defaultItem];
      }

      renderGrid();
    });
  </script>
</body>
</html>
